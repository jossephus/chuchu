# JitPack builds the plugin API from this repo as com.github.jossephus:chuchu:<tag or commit>
# (JitPack names a repo's only artifact after the repo).
# The Gradle project lives in android/, and only the plugin API is published: the app
# itself needs the Zig/NDK toolchain, which JitPack doesn't have and doesn't need here.
jdk:
  - openjdk17
install:
  - cd android && ./gradlew :plugin-api:publishReleasePublicationToMavenLocal --no-daemon
